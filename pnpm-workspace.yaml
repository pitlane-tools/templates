    "@remix-run/session@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/session": false
    "@remix-run/session-middleware@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/session-middleware": false
    "@remix-run/session-storage-memcache@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/session-storage-memcache": false
    "@remix-run/session-storage-redis@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/session-storage-redis": false
    "@remix-run/static-middleware@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/static-middleware": false
    "@remix-run/tar-parser@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/tar-parser": false
    "@remix-run/terminal@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/terminal": false
    "@remix-run/test@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/test": false
    "@remix-run/ui@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/ui": false

# The remix preview build resolves its @remix-run/* dependencies as git
# tarballs from the same commit; pnpm 11 blocks exotic transitive
# dependencies by default.
blockExoticSubdeps: false

# This repository validates @pitlane/dev releases the moment they publish;
# pnpm 11's minimum-release-age gate would otherwise block fresh versions.
# Scaffolded apps carry the same exclusion in their own pnpm-workspace.yaml —
# a Pitlane template trusts Pitlane's package at any age.
minimumReleaseAgeExclude:
    - "@pitlane/dev"
