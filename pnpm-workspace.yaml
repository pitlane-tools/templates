    "@remix-run/multipart-parser@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/multipart-parser": false
    "@remix-run/node-fetch-server@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/node-fetch-server": false
    "@remix-run/node-tsx@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/node-tsx": false
