# Deno templates use npm for preview tarballs and remain outside this workspace.
packages:
    - cloudflare
    - github-pages
    - netlify
    - railway-bun
    - railway-node
    - vercel

allowBuilds:
    remix: true
    workerd: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant here.
    esbuild: false
    sharp: false

# This repository validates Remix and Pitlane releases the moment they publish;
# pnpm 11's minimum-release-age gate would otherwise block fresh versions. Every
# package a template tracks that way has to be listed: a missing entry does not
# fail with a release-age message, it churns resolution until it gives up.
# Scaffolded apps carry the same exclusion in their own pnpm-workspace.yaml —
# a Pitlane template trusts these packages at any age.
minimumReleaseAgeExclude:
    - "@pitlane/crawler"
    - "@pitlane/data-table-d1"
    - "@pitlane/assets"
    - "@pitlane/vite-plugin-fetch-server"
    - "@pitlane/vite-plugin-remix"
    - "@pitlane/theme"
    - "@remix-run/*"
    - "remix"

# TEMPORARY while templates PR #12 is a draft: the package candidates depend
# on each other through pkg.pr.new URLs, which pnpm rejects as exotic
# subdependencies. These pins are replaced only after the release is installable.
# Remove this setting together with the preview pins before the PR leaves draft.
blockExoticSubdeps: false

# The vite alias is Vite+ core 1.x, which implements the supported Vite 8 API.
peerDependencyRules:
    allowedVersions:
        vite: "1"
