# The two Deno templates (railway-deno, deno-deploy) are Deno-native — no
# package.json — and install with `deno install` instead of pnpm.
packages:
    - cloudflare
    - github-pages
    - netlify
    - railway-bun
    - railway-node
    - vercel

allowBuilds:
    remix: true
    workerd: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant here.
    esbuild: false
    sharp: false
    # The github-pages template installs Remix from a preview build of
    # remix-run/remix#11629. pnpm resolves it (and its @remix-run/*
    # dependencies) as codeload tarballs, which allowBuilds only matches by
    # exact resolved path — regenerate these keys when the preview commit
    # moves. The remix meta-package must build (prepare); the @remix-run/*
    # packages ship prebuilt dist, so their scripts are declined.
    "remix@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/remix": true
    "@remix-run/assert@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/assert": false
    "@remix-run/assets@https://codeload.github.com/remix-run/remix/tar.gz/debb3e91275ad97874608dd2c760354cfe23dd89#path:packages/assets": false
