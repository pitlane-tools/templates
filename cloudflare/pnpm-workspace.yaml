# pnpm 11 settings for this app (older pnpm reads the same intent from
# package.json fields it no longer supports).
allowBuilds:
    remix: true
    workerd: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant.
    esbuild: false
    sharp: false

# Trust Remix, Pitlane, and Cloudflare's own packages at any release age;
# everything else keeps pnpm's default minimum-release-age protection. `cf` and
# `@cloudflare/vite-plugin` are pinned to exact betas that publish often, and a
# release-age gate on an exact pin has nothing older to fall back to.
minimumReleaseAgeExclude:
    - "@cloudflare/*"
    - "@pitlane/*"
    - "@remix-run/*"
    - "cf"
    - "pitlane"
    - "remix"

# The vite alias is Vite+ core 1.x, which implements the supported Vite 8 API.
peerDependencyRules:
    allowedVersions:
        vite: "1"
