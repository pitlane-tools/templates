# .github/workflows/deploy.yml
name: Deploy

on:
    push:
        branches: [main]

permissions:
    contents: read
    deployments: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            CF_SEND_TELEMETRY: "false"
        steps:
            - uses: actions/checkout@v4

            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - run: vp install --frozen-lockfile

            # `vp build` writes Cloudflare's Build Output to .cloudflare/output;
            # `cf build` would run `vite build`, and this project's Vite is Vite+.
            - run: vp build

            - run: vp run db:migrate:remote

            - run: vpx cf deploy --prebuilt --mode production
