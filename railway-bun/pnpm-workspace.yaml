# pnpm 11 settings for this app (older pnpm reads the same intent from
# package.json fields it no longer supports).
allowBuilds:
    remix: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant.
    esbuild: false
    sharp: false

# Trust Remix and Pitlane's own packages at any release age; everything else
# keeps pnpm's default minimum-release-age protection.
minimumReleaseAgeExclude:
    - "@pitlane/assets"
    - "@pitlane/crawler"
    - "@pitlane/theme"
    - "@pitlane/vite-plugin-fetch-server"
    - "@pitlane/vite-plugin-remix"
    - "@remix-run/*"
    - "remix"

# The vite alias is Vite+ core 1.x, which implements the supported Vite 8 API.
peerDependencyRules:
    allowedVersions:
        vite: "1"
