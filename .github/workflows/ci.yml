# .github/workflows/ci.yml — build every template on every push/PR.
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    node-templates:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                template: [cloudflare, github-pages, netlify, railway-bun, railway-node, vercel]
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # pnpm/action-setup installs pnpm under
            # ~/setup-pnpm/node_modules/.bin and derives its store from there,
            # so the default store path contains "node_modules". The
            # github-pages template's git-hosted remix preview is unpacked into
            # that store and prepared by running its own
            # scripts/postinstall.ts, and Node refuses to strip types from any
            # .ts file under a node_modules directory — every job died on
            # ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING. It has to be the CLI
            # flag: pnpm 11 ignores npm_config_store_dir and PNPM_STORE_DIR.
            - run: pnpm install --no-frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
              env:
                  # The github-pages template installs remix from a preview
                  # build prepared out of a git checkout whose own lockfile is
                  # intentionally out of date; stop CI's frozen-lockfile default
                  # from leaking into that nested install.
                  npm_config_frozen_lockfile: "false"

            - run: pnpm --filter ./${{ matrix.template }} exec vp build

    deno-templates:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                template: [deno-deploy, railway-deno]
        defaults:
            run:
                working-directory: ${{ matrix.template }}
        steps:
            - uses: actions/checkout@v4

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            # CI validates @pitlane/dev releases the moment they publish, so
            # Deno's minimum-dependency-age gate (24h) is disabled here only —
            # scaffolded apps keep the default supply-chain protection.
            - run: deno install --allow-scripts --minimum-dependency-age=0

            - run: deno task build

            - run: deno task check

    # The PGlite dev database is Postgres-in-WASM; also prove the same
    # migrations and queries run against a conventional PostgreSQL server.
    postgres-integration:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: guestbook
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/guestbook
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # See the node-templates install step for both settings: the nested
            # prepare install for git-hosted remix cannot run frozen, and its
            # postinstall cannot run from a store under node_modules.
            - run: pnpm install --no-frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
              env:
                  npm_config_frozen_lockfile: "false"

            - run: node db/migrate.ts
              working-directory: vercel

            - run: |
                  node --input-type=module -e "
                  import { Pool } from 'pg';
                  let pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
                  let write = await pool.query(
                      'INSERT INTO guest_book (name, message) VALUES (\$1, \$2) RETURNING id',
                      ['CI', 'hello from a real Postgres'],
                  );
                  let read = await pool.query('SELECT name, message FROM guest_book');
                  console.log(read.rows);
                  if (read.rows.length !== 1) process.exit(1);
                  await pool.end();
                  "
              working-directory: vercel
