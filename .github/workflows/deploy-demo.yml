# .github/workflows/deploy-demo.yml — keeps the live Cloudflare demo current.
#
# Deploys the cloudflare template to the canonical demo Worker
# (https://pitlane-cloudflare.mark-malstrom.workers.dev) whenever the template
# changes, on demand, and on a weekly schedule so floating dependency ranges
# (@pitlane/dev, remix) are picked up without a commit.
#
# Wiring (already set on this repository):
#   secret CLOUDFLARE_API_TOKEN          — Workers + D1 edit permissions
#   var    CLOUDFLARE_ACCOUNT_ID         — the account to deploy into
#   var    CLOUDFLARE_D1_DATABASE_ID     — `wrangler d1 create pitlane-cloudflare-db`
#
# The template itself ships with `"database_id": "local"`; the real id is
# injected here at deploy time so scaffolded apps stay account-agnostic.
name: Deploy demo

on:
    push:
        branches: [main]
        paths:
            - cloudflare/**
            - .github/workflows/deploy-demo.yml
    workflow_dispatch:
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read

concurrency:
    group: deploy-demo
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4

            # Until @pitlane/dev is published, installing the template fails on
            # npm — skip gracefully; the guard self-deactivates at publish.
            - name: Check @pitlane/dev is published
              id: published
              run: |
                  if npm view @pitlane/dev version >/dev/null 2>&1; then
                      echo "ok=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::@pitlane/dev is not on npm yet — skipping the demo deploy."
                      echo "ok=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: pnpm/action-setup@v4
              if: steps.published.outputs.ok == 'true'

            - uses: actions/setup-node@v4
              if: steps.published.outputs.ok == 'true'
              with:
                  node-version: 24

            - run: pnpm install --no-frozen-lockfile
              if: steps.published.outputs.ok == 'true'

            - name: Point wrangler at the demo database
              if: steps.published.outputs.ok == 'true'
              working-directory: cloudflare
              run: sed -i 's/"database_id": "local"/"database_id": "'"$D1_DATABASE_ID"'"/' wrangler.jsonc
              env:
                  D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}

            - run: pnpm exec vp build
              if: steps.published.outputs.ok == 'true'
              working-directory: cloudflare

            - run: pnpm exec vp run db:migrate:remote
              if: steps.published.outputs.ok == 'true'
              working-directory: cloudflare

            - run: pnpm exec wrangler deploy
              if: steps.published.outputs.ok == 'true'
              working-directory: cloudflare

            - name: Smoke test the deployment
              if: steps.published.outputs.ok == 'true'
              run: |
                  URL="https://pitlane-cloudflare.mark-malstrom.workers.dev"
                  STATUS=$(curl -sm 20 -o /dev/null -w "%{http_code}" "$URL/")
                  echo "GET / → $STATUS"
                  test "$STATUS" = "200"
