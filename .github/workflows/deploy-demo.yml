# .github/workflows/deploy-demo.yml — keeps the live Cloudflare demo current.
#
# Deploys the cloudflare template to the canonical demo Worker
# (https://guestbook.pitlane.tools) whenever the template changes, and on
# demand.
#
# Wiring (already set on this repository):
#   secret CLOUDFLARE_API_TOKEN          — Workers + D1 edit permissions
#   var    CLOUDFLARE_ACCOUNT_ID         — the account to deploy into
#   var    CLOUDFLARE_D1_DATABASE_ID     — `wrangler d1 create pitlane-cloudflare-db`
#
# The template itself ships with `"database_id": "local"`; the real id is
# injected here at deploy time so scaffolded apps stay account-agnostic.
name: Deploy demo

on:
    push:
        branches: [main]
        paths:
            - cloudflare/**
            - .github/workflows/deploy-demo.yml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-demo
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - run: pnpm install --no-frozen-lockfile

            - name: Point wrangler at the demo database
              working-directory: cloudflare
              run: |
                  sed -i 's/"database_id": "local"/"database_id": "'"$D1_DATABASE_ID"'"/' wrangler.jsonc
              env:
                  D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}

            - run: pnpm exec vp build
              working-directory: cloudflare

            - run: pnpm exec vp run db:migrate:remote
              working-directory: cloudflare

            - run: pnpm exec wrangler deploy
              working-directory: cloudflare

            - name: Smoke test the deployment
              run: |
                  URL="https://guestbook.pitlane.tools"
                  STATUS=$(curl -sm 20 -o /dev/null -w "%{http_code}" "$URL/")
                  echo "GET / → $STATUS"
                  test "$STATUS" = "200"
